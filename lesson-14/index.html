    <script>
         // ---------- Puzzle 1: Same name, different variable ----------
// PREDICTION: 3, 2
// ACTUAL: 3, 2
// WHY: lives = 3 and left = 3 - 1 so its 2 leaving 3, 2 as the output 
console.log("--- Puzzle 1 ---");
let lives = 3;
function loseLife(lives) {
    lives = lives - 1;
    return lives;
}
let left = loseLife(lives);
console.log(lives, left);


// ---------- Puzzle 2: The unchanged score ----------
// PREDICTION: 100 50
// ACTUAL: 100 50
// WHY: doubleIt multiples score (50) by 2 which is 100 and console.log(score) is 50
console.log("--- Puzzle 2 ---");
let score = 50;
function doubleIt(num) {
    num = num * 2;
    console.log(num);
}
doubleIt(score);
console.log(score);


// ---------- Puzzle 3: The quiet shout ----------
// PREDICTION: DOG
// ACTUAL: dog
// WHY: theres no return value to return the output
console.log("--- Puzzle 3 ---");
function shout(word) {
    word = word.toUpperCase();
}
let pet = "dog";
shout(pet);
console.log(pet);

// MY FIX: Complete shoutFixed so pet ends up as "DOG"
// without making pet global inside the function. (Hint: return)
function shoutFixed(word) {
    word = word.toUpperCase();
    return word;
}
pet = shoutFixed(pet);
console.log("Puzzle 3 fix:", pet);
